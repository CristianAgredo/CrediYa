server:
  port: 8081
spring:
  application:
    name: "autenticacion"
  r2dbc:
    url: "r2dbc:postgresql://localhost:5432/solicitudes"
    username: "postgres"
    password: "postgres"
  jackson:
    default-property-inclusion: "non_null"
  datasource:
    url: "jdbc:h2:mem:test"
    username: "sa"
    password: "pass"
    driverClassName: "org.h2.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.H2Dialect"
logging:
  level:
    root: "INFO"
    org.springframework.r2dbc: "INFO"
springdoc:
  swagger-ui:
    path: "/docs"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
